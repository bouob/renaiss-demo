# Build always. On push to main: deploy Cloud Function + Hosting *preview channel*
# (does NOT overwrite live Hosting site — safe if SA project is shared with Dokipoki).
#
# Live hosting promote is manual: workflow_dispatch with deploy_live_hosting=true
# (still requires explicit confirmation intent).

name: ci-deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_merchant_site:
        description: 'Deploy root SPA to multi-site merchant-dokipoki-dev (safe; does NOT touch default site)'
        type: boolean
        default: true
      deploy_live_hosting:
        description: 'DANGEROUS: deploy path build to DEFAULT site live hosting'
        type: boolean
        default: false
      skip_deploy:
        description: 'Only build (no firebase deploy)'
        type: boolean
        default: false

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Syntax-check + unit tests (server)
        working-directory: server
        run: |
          npm run check
          npm test

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Build client (inject VITE_*)
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Prepare hosting-public layout
        run: node scripts/prepare-hosting.mjs

      - name: Upload hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-public
          path: hosting-public
          retention-days: 7

      - name: Upload server source (for deploy job)
        uses: actions/upload-artifact@v4
        with:
          name: server-src
          path: |
            server
            firebase.json
            firebase.merchant-site.json
            .firebaserc
            package.json
            scripts
          retention-days: 1

  deploy:
    needs: build
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Download hosting artifact
        uses: actions/download-artifact@v4
        with:
          name: hosting-public
          path: hosting-public

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install client + rebuild (for local prepare parity)
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
        # hosting-public already from artifact; refresh in case structure changes
      - run: node scripts/prepare-hosting.mjs

      - name: Write server runtime env (deployed with function package)
        working-directory: server
        env:
          RENAISS_INDEX_API_KEY: ${{ secrets.RENAISS_INDEX_API_KEY }}
          RENAISS_INDEX_API_SECRET: ${{ secrets.RENAISS_INDEX_API_SECRET }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          GCP_SERVICE_ACCOUNT_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_BASE64 }}
        run: |
          # CORS=* → reflect origin (preview channel hostnames vary)
          cat > .env <<EOF
          RENAISS_INDEX_API_KEY=${RENAISS_INDEX_API_KEY}
          RENAISS_INDEX_API_SECRET=${RENAISS_INDEX_API_SECRET}
          BSC_RPC_URL=${BSC_RPC_URL}
          GCP_SERVICE_ACCOUNT_BASE64=${GCP_SERVICE_ACCOUNT_BASE64}
          CORS_ORIGIN=*
          IS_LOCAL_DEV=false
          EOF
          # strip leading spaces from heredoc if any
          sed -i 's/^[[:space:]]*//' .env

      - name: Decode GCP service account
        id: sa
        env:
          GCP_SERVICE_ACCOUNT_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_BASE64" ]; then
            echo "GCP_SERVICE_ACCOUNT_BASE64 missing — cannot deploy"
            exit 1
          fi
          echo "$GCP_SERVICE_ACCOUNT_BASE64" | base64 -d > "${RUNNER_TEMP}/sa.json"
          PROJECT_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/sa.json','utf8')).project_id)")
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved Firebase/GCP project: $PROJECT_ID"

      - name: Point .firebaserc at SA project + merchant target
        run: |
          node -e "
            const fs=require('fs');
            const p='${{ steps.sa.outputs.project_id }}';
            fs.writeFileSync('.firebaserc', JSON.stringify({
              projects: { default: p },
              targets: { [p]: { hosting: { merchant: ['merchant-dokipoki-dev'] } } },
              etags: {}
            }, null, 2));
          "

      - name: Install firebase-tools + gcloud auth
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools@13
          # SA login for gcloud functions deploy fallback
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "${{ steps.sa.outputs.project_id }}"

      # Multi-site: merchant-dokipoki-dev root SPA (base=/). Safe — never default site.
      - name: Ensure merchant Hosting site + target
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_merchant_site != false }}
        id: merchant_site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          PROJECT="${{ steps.sa.outputs.project_id }}"
          firebase hosting:sites:create merchant-dokipoki-dev --project "$PROJECT" --non-interactive 2>&1 | tee site-create.txt
          # already-exists is fine
          firebase target:apply hosting merchant merchant-dokipoki-dev --project "$PROJECT" --non-interactive
          echo "site=merchant-dokipoki-dev" >> "$GITHUB_OUTPUT"

      - name: Build merchant root SPA (base=/)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_merchant_site != false }}
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          # client deps already installed above; rebuild for root base
          npx vite build --base /

      - name: Deploy Hosting → merchant-dokipoki-dev (target merchant)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_merchant_site != false }}
        id: merchant_hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -e
          PROJECT="${{ steps.sa.outputs.project_id }}"
          firebase deploy --only hosting:merchant \
            --config firebase.merchant-site.json \
            --project "$PROJECT" \
            --non-interactive 2>&1 | tee merchant-hosting-out.txt
          echo "url=https://merchant-dokipoki-dev.web.app" >> "$GITHUB_OUTPUT"
          echo "Merchant multi-site: https://merchant-dokipoki-dev.web.app/"

      - name: Deploy Hosting preview channel (path layout on default site)
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.deploy_live_hosting != true && inputs.deploy_merchant_site == false) }}
        id: channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -e
          # Preview channel on default site — path /merchant/ layout
          firebase hosting:channel:deploy merchant-preview \
            --project "${{ steps.sa.outputs.project_id }}" \
            --expires 14d \
            --non-interactive 2>&1 | tee channel-out.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.web\.app[a-zA-Z0-9/_-]*' channel-out.txt | head -n1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "WARNING: could not parse channel URL — see log above"
          else
            echo "Preview URL: $URL"
            echo "Merchant path: ${URL%/}/merchant/"
          fi

      - name: Deploy live Hosting DEFAULT site (explicit only — DANGEROUS)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_live_hosting == true }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo "Deploying LIVE hosting to DEFAULT site project ${{ steps.sa.outputs.project_id }}"
          firebase deploy --only hosting --project "${{ steps.sa.outputs.project_id }}" --non-interactive

      # merchantApi MUST deploy from renaiss-demo alone (no Dokipoki dependency).
      # Failure here fails the workflow — hosting-only green is not enough.
      - name: Deploy Cloud Function merchantApi
        id: fn
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          RENAISS_INDEX_API_KEY: ${{ secrets.RENAISS_INDEX_API_KEY }}
          RENAISS_INDEX_API_SECRET: ${{ secrets.RENAISS_INDEX_API_SECRET }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          GCP_SERVICE_ACCOUNT_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set +e
          PROJECT="${{ steps.sa.outputs.project_id }}"

          # Path A: Firebase CLI (firebase-functions export in index.js)
          firebase deploy --only functions:merchantApi --project "$PROJECT" --non-interactive --force
          code=$?
          if [ $code -eq 0 ]; then
            echo "mode=firebase" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "firebase CLI failed ($code); trying gcloud + Functions Framework entry (function.js)"

          # Path B: gcloud gen2 — stage server only, force main=function.js
          # Root monorepo package.json has "build": vite and must NEVER be the source root.
          STAGE="${RUNNER_TEMP}/merchant-fn-src"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a server/. "$STAGE/"
          # Point Cloud Build at Functions Framework entry (function.js).
          # Avoid monorepo root package.json "build": vite entirely.
          STAGE_DIR="$STAGE" node -e '
            const fs = require("fs");
            const pkgPath = process.env.STAGE_DIR + "/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.main = "function.js";
            pkg.scripts = pkg.scripts || {};
            delete pkg.scripts.build;
            pkg.scripts.start = "functions-framework --target=merchantApi";
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
            console.log("staged package.json main=", pkg.main);
          '
          (cd "$STAGE" && npm ci --omit=dev)

          # Pass secrets via env file to avoid argv leakage length limits
          ENV_YAML="${RUNNER_TEMP}/merchant-fn-env.yaml"
          cat > "$ENV_YAML" <<EOF
          CORS_ORIGIN: "*"
          IS_LOCAL_DEV: "false"
          RENAISS_INDEX_API_KEY: "${RENAISS_INDEX_API_KEY}"
          RENAISS_INDEX_API_SECRET: "${RENAISS_INDEX_API_SECRET}"
          BSC_RPC_URL: "${BSC_RPC_URL}"
          GCP_SERVICE_ACCOUNT_BASE64: "${GCP_SERVICE_ACCOUNT_BASE64}"
          EOF
          # strip accidental leading spaces from heredoc lines
          sed -i 's/^[[:space:]]*//' "$ENV_YAML"

          gcloud functions deploy merchantApi \
            --gen2 \
            --runtime=nodejs20 \
            --region=asia-east1 \
            --source="$STAGE" \
            --entry-point=merchantApi \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512MiB \
            --timeout=60s \
            --set-build-env-vars="GOOGLE_NODE_RUN_SCRIPTS=" \
            --env-vars-file="$ENV_YAML" \
            --project="$PROJECT"
          code=$?
          if [ $code -eq 0 ]; then
            echo "mode=gcloud" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=failed" >> "$GITHUB_OUTPUT"
          echo "::error::merchantApi deploy failed (firebase + gcloud). API cannot ship from renaiss-demo alone until this is green."
          exit $code

      - name: Post-deploy health check
        id: health
        if: ${{ steps.fn.outcome == 'success' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -e
          PROJECT="${{ steps.sa.outputs.project_id }}"
          URLS=(
            "https://merchant.dokipoki.app/api/health"
            "https://merchant-dokipoki-dev.web.app/api/health"
          )
          FN_URL=$(gcloud functions describe merchantApi --gen2 --region=asia-east1 --project="$PROJECT" --format='value(serviceConfig.uri)' 2>/dev/null || true)
          if [ -n "$FN_URL" ]; then
            URLS+=("${FN_URL%/}/api/health")
            URLS+=("${FN_URL%/}/health")
          fi
          ok=0
          for url in "${URLS[@]}"; do
            echo "GET $url"
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 25 "$url" || echo 000)
              body=$(cat /tmp/health.json 2>/dev/null || true)
              echo "  try=$i http=$code body=$body"
              if [ "$code" = "200" ] && echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                ok=1
                break 2
              fi
              sleep 8
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::error::No health endpoint returned 200 after merchantApi deploy"
            exit 1
          fi
          echo "health=ok" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`${{ steps.sa.outputs.project_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function deploy: \`${{ steps.fn.outcome }}\` mode=\`${{ steps.fn.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: \`${{ steps.health.outputs.health || 'n/a' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Multi-site merchant: \`${{ steps.merchant_hosting.outputs.url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom domain: \`https://merchant.dokipoki.app/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path mount (optional Dokipoki): \`https://dokipoki-dev.web.app/merchant/\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.fn.outcome }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Function deploy failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Primary path: \`firebase deploy --only functions:merchantApi\` (needs SA Firebase Admin / Extensions Viewer)." >> "$GITHUB_STEP_SUMMARY"
            echo "Fallback: gcloud gen2 with \`server/function.js\` + Functions Framework (\`main=function.js\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
